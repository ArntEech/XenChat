<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Profile Settings — XenChat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Manrope:wght@400;500&family=Montserrat:wght@600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/site.css" />
</head>
<body class="chat-body">
    <div class="settings-layout">
        <!-- Sidebar -->
        <aside class="settings-sidebar">
            <div class="settings-sidebar-header">
                <a href="index.html" class="settings-back-btn" title="Back to chats">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
                <h1 class="settings-title">Settings</h1>
            </div>

            <nav class="settings-nav-list">
                <button class="settings-nav-item active" type="button">
                    <svg class="settings-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <span>Profile Details</span>
                </button>
            </nav>

            <div class="settings-sidebar-footer">
                <button type="button" id="logoutBtn" class="settings-logout-btn" style="background: none; border: none; width: 100%; cursor: pointer;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                    <span>Log Out</span>
                </button>
            </div>
        </aside>

        <!-- Settings Content -->
        <main class="settings-content-area">
            <header class="settings-header">
                <h2>Profile Details</h2>
            </header>

            <div class="settings-body-scroll">
                <div id="statusAlert" class="auth-success" style="display: none; margin-bottom: 20px;"></div>
                <div id="errorAlert" class="auth-error" style="display: none; margin-bottom: 20px;"></div>

                <div class="settings-card">
                    <div class="profile-hero-section">
                        <div class="profile-hero-avatar-wrap">
                            <img id="avatarPreview" src="images/avatars/user.png" alt="Avatar" class="profile-hero-avatar" />
                            <button type="button" id="changeAvatarBtn" class="avatar-camera-badge" title="Change photo">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                    <circle cx="12" cy="13" r="4"></circle>
                                </svg>
                            </button>
                            <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" />
                        </div>
                        <div class="profile-hero-meta">
                            <h3 id="displayUsername" style="margin: 0; color: #fff; font-size: 20px;">Username</h3>
                            <p id="displayEmail" style="margin: 4px 0 0 0; color: #888; font-size: 13px;">user@example.com</p>
                        </div>
                    </div>

                    <form id="profileForm" style="margin-top: 24px;">
                        <div class="settings-form-group">
                            <label for="usernameInput" class="settings-label">Display Name / Username</label>
                            <input type="text" id="usernameInput" name="username" class="settings-input" required />
                        </div>

                        <div class="settings-form-group" style="margin-top: 16px;">
                            <label for="bioInput" class="settings-label">About / Bio</label>
                            <textarea id="bioInput" name="profileInfo" class="settings-input" rows="3" placeholder="Tell contacts about yourself..."></textarea>
                        </div>

                        <div style="margin-top: 24px; display: flex; gap: 12px;">
                            <button type="submit" id="saveProfileBtn" class="primary-button" style="width: auto; padding: 0 24px;">Save Changes</button>
                            <button type="button" id="removeAvatarBtn" style="background: #2a2a32; border: none; color: #ff5c5c; padding: 0 16px; border-radius: 8px; cursor: pointer;">Remove Photo</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await AUTH.requireAuth();
            if (!user) return;

            const avatarPreview = document.getElementById('avatarPreview');
            const displayUsername = document.getElementById('displayUsername');
            const displayEmail = document.getElementById('displayEmail');
            const usernameInput = document.getElementById('usernameInput');
            const bioInput = document.getElementById('bioInput');
            const form = document.getElementById('profileForm');
            const statusAlert = document.getElementById('statusAlert');
            const errorAlert = document.getElementById('errorAlert');
            const saveBtn = document.getElementById('saveProfileBtn');
            const changeAvatarBtn = document.getElementById('changeAvatarBtn');
            const avatarFileInput = document.getElementById('avatarFileInput');
            const removeAvatarBtn = document.getElementById('removeAvatarBtn');
            const logoutBtn = document.getElementById('logoutBtn');

            let selectedAvatarFile = null;
            let removeAvatarFlag = false;

            function renderUser(u) {
                displayUsername.textContent = u.username;
                displayEmail.textContent = u.email;
                usernameInput.value = u.username;
                bioInput.value = u.profileInfo || '';
                avatarPreview.src = CONFIG.resolveAvatarUrl(u.avatarPath || u.avatar);
            }

            renderUser(user);

            changeAvatarBtn.addEventListener('click', () => avatarFileInput.click());

            avatarFileInput.addEventListener('change', function () {
                if (this.files && this.files[0]) {
                    selectedAvatarFile = this.files[0];
                    removeAvatarFlag = false;
                    const reader = new FileReader();
                    reader.onload = (e) => avatarPreview.src = e.target.result;
                    reader.readAsDataURL(selectedAvatarFile);
                }
            });

            removeAvatarBtn.addEventListener('click', () => {
                removeAvatarFlag = true;
                selectedAvatarFile = null;
                avatarFileInput.value = '';
                avatarPreview.src = 'images/avatars/user.png';
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                statusAlert.style.display = 'none';
                errorAlert.style.display = 'none';
                saveBtn.disabled = true;
                saveBtn.textContent = 'Saving...';

                try {
                    const formData = new FormData();
                    formData.append('username', usernameInput.value.trim());
                    formData.append('profileInfo', bioInput.value.trim());
                    if (removeAvatarFlag) {
                        formData.append('removeAvatar', 'true');
                    } else if (selectedAvatarFile) {
                        formData.append('avatarFile', selectedAvatarFile);
                    }

                    const res = await API.postForm('/api/user/profile', formData);
                    if (res && res.success && res.user) {
                        AUTH.setCurrentUser(res.user);
                        renderUser(res.user);
                        statusAlert.textContent = 'Profile updated successfully!';
                        statusAlert.style.display = 'block';
                        selectedAvatarFile = null;
                        removeAvatarFlag = false;
                    } else {
                        errorAlert.textContent = res.error || 'Failed to update profile.';
                        errorAlert.style.display = 'block';
                    }
                } catch (err) {
                    errorAlert.textContent = 'Could not connect to server.';
                    errorAlert.style.display = 'block';
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Save Changes';
                }
            });

            logoutBtn.addEventListener('click', () => AUTH.logout());
        });
    </script>
</body>
</html>
